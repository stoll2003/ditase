<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dita.se</title>
<style>
  /* Ilha do Windows 1.0.2 (SPEC-windows-identidade.md §2): a pílula do Mac no topo da tela.
     Escura e igual nos dois temas do sistema. Sem atributo style no HTML: o Tauri põe hashes na
     style-src e o navegador passa a descartar style inline (era o que deslocava a casca no app). */
  :root {
    /* Sem color-scheme: com "dark", o fundo da página deixa de ser transparente sobre papel claro. */
    --ilha-fundo: #121212;
    --ilha-fundo-aberta: #1A1A1A;
    --ilha-traco: rgba(255, 255, 255, .16);
    --ilha-traco-barrinha: rgba(255, 255, 255, .40);
    --ilha-traco-aceno: rgba(255, 255, 255, .55);
    --ilha-aro: rgba(0, 0, 0, .45);
    --ilha-texto: #FFFFFF;
    --ilha-texto-2: #B3B3B3;
    --ilha-hover: rgba(255, 255, 255, .10);
    --ilha-pressionado: rgba(255, 255, 255, .06);
    --ilha-chip: rgba(255, 255, 255, .08);
    --ilha-divisor: rgba(255, 255, 255, .16);
    --ilha-gravar: #FF453A;
    --ilha-progresso: #0A84FF;
    --ilha-aviso: #FF9F0A;
    --ilha-info: #0A84FF;
    --ilha-fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --ilha-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font: 600 12px/16px var(--ilha-fonte);
    color: var(--ilha-texto);
  }

  .palco { position: relative; width: 100%; height: 100%; overflow: hidden; }

  /* Uma forma só: barrinha, recolhida e aberta são a mesma .casca com outro tamanho. Tamanho,
     topo e raio vêm do laço da forma (pilula.js), via CSSOM. */
  /* Centraliza mesmo quando o host redimensiona a janela depois do último quadro. */
  .casca, .tracos {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }
  .casca {
    box-sizing: border-box;
    background: var(--ilha-fundo-aberta);
    box-shadow: inset 0 0 0 1px var(--ilha-traco), 0 0 0 1px var(--ilha-aro);
    overflow: hidden;
    transition: background-color 180ms ease, box-shadow 180ms ease;
  }
  .palco[data-estado="repouso"] .casca {
    background: var(--ilha-fundo);
    box-shadow: inset 0 0 0 1px var(--ilha-traco-barrinha), 0 0 0 1px rgba(0, 0, 0, .35);
  }
  .palco[data-estado="aceno"] .casca {
    background: var(--ilha-fundo);
    box-shadow: inset 0 0 0 1px var(--ilha-traco-aceno), 0 0 0 1px rgba(0, 0, 0, .35);
  }
  .palco[data-recolhida="1"] .casca { background: var(--ilha-fundo); }

  /* Alvo da barrinha: a janela inteira de 72x14 (maior que a barrinha). */
  .alvo-ponta {
    position: absolute;
    inset: 0;
    cursor: pointer;
    z-index: 4;
  }
  .palco:not([data-estado="repouso"]):not([data-estado="aceno"]) .alvo-ponta { display: none; }

  /* Contorno de progresso e segmento: caminho fechado da cápsula recuado 1 px (§2.4). */
  .tracos {
    overflow: visible;
    pointer-events: none;
    z-index: 3;
  }
  .tracos path { fill: none; stroke: var(--ilha-progresso); stroke-width: 2; stroke-linecap: round; }

  .tracos .contorno {
    stroke-dasharray: var(--fracao, 0) 1;
    opacity: 0;
    transition: stroke-dasharray 240ms ease, opacity 160ms ease;
  }
  .palco[data-contorno="ativo"] .tracos .contorno { opacity: 1; }
  .palco[data-estado="erro"] .tracos .contorno {
    stroke: var(--ilha-gravar);
    stroke-width: 1.5;
    stroke-dasharray: none;
    opacity: 1;
  }

  /* Processando sem fração (§2.5): segmento de 22% girando em 1,2 s linear, sentido horário a
     partir do topo. A mesma animação vale em todos os estados do segmento, então trocar de
     estado (recolhida/aberta, saída) não reinicia a volta. */
  .tracos .segmento {
    stroke-dasharray: 0.22 0.78;
    stroke-dashoffset: 0;
    opacity: 0;
    transition: opacity 160ms ease;
  }
  .tracos .inteiro { stroke-width: 1.5; opacity: 0; }
  .palco[data-segmento] .tracos .segmento { animation: girar-arco 1.2s linear infinite; }
  .palco[data-segmento="girando"] .tracos .segmento { opacity: 1; transition: opacity 120ms ease; }

  .palco[data-segmento="saindo"] .tracos .segmento { animation-play-state: paused; }

  @keyframes girar-arco {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -1; }
  }

  /* Conteúdo parado na posição final, cortado pela casca. */
  .conteudo {
    position: absolute;
    left: 50%;
    top: 0;
    height: 100%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 100ms ease;
    pointer-events: none;
  }
  .palco[data-conteudo="visivel"] .conteudo { opacity: 1; transition: opacity 160ms ease; }
  .palco[data-conteudo="visivel"][data-interativo="1"] .conteudo { pointer-events: auto; }

  .vista { display: none; align-items: center; gap: 8px; flex-shrink: 0; }
  .vista.ativa { display: flex; }

  .btn-ditar {
    all: unset;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    border-radius: 14px;
    color: var(--ilha-texto);
    font: 600 12px/16px var(--ilha-fonte);
    cursor: pointer;
    transition: background-color 120ms ease;
  }
  .btn-ditar:hover { background: var(--ilha-hover); }
  .btn-ditar:active { background: var(--ilha-pressionado); }

  .divisor { width: 1px; height: 14px; background: var(--ilha-divisor); margin: 0 0; }

  .kbd {
    display: inline-flex;
    align-items: center;
    height: 20px;
    padding: 0 6px;
    border-radius: 6px;
    background: var(--ilha-chip);
    color: var(--ilha-texto-2);
    font-weight: 500;
  }

  .ponto { width: 6px; height: 6px; border-radius: 50%; background: var(--ilha-gravar); flex: none; }
  .ponto-aviso { width: 7px; height: 7px; border-radius: 50%; background: var(--ilha-info); flex: none; }
  .palco[data-alerta="1"] .ponto-aviso { background: var(--ilha-aviso); }
  .palco[data-estado="erro"] .ponto-aviso { background: var(--ilha-gravar); }

  .barras { display: flex; align-items: center; gap: 3px; height: 18px; }
  .barras i {
    display: block;
    width: 3px;
    height: 18px;
    border-radius: 1.5px;
    background: #FFFFFF;
    opacity: 0.55;
    transform: scaleY(0.22);
    transform-origin: center;
  }

  .tempo {
    width: 34px;
    font: 500 12px/16px var(--ilha-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ilha-texto-2);
  }

  .btn-circ {
    all: unset;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 14px;
    background: var(--ilha-hover);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color 120ms ease;
  }
  .btn-circ svg { opacity: 0.8; }
  .btn-circ.cancelar:hover { background: var(--ilha-gravar); }
  .btn-circ.cancelar:hover svg { opacity: 1; }
  .btn-circ.parar { background: var(--ilha-gravar); }
  .btn-circ.parar:hover { filter: brightness(1.1); }
  .btn-circ.parar b { width: 10px; height: 10px; border-radius: 2px; background: #FFFFFF; display: block; }

  .pontos { display: flex; gap: 4px; flex-shrink: 0; }
  .pontos i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #FFFFFF;
    display: block;
    animation: onda 1.15s ease-in-out infinite;
  }
  .pontos i:nth-child(2) { animation-delay: 130ms; }
  .pontos i:nth-child(3) { animation-delay: 260ms; }
  /* Sem animação fora do processamento (0% de CPU em repouso). */
  .vista:not(.ativa) .pontos i { animation: none; }
  @keyframes onda {
    0%, 100% { transform: translateY(0); opacity: 0.45; }
    50% { transform: translateY(-2px); opacity: 1; }
  }

  .etapa-texto { overflow: hidden; text-overflow: ellipsis; max-width: var(--texto-max, 168px); }
  .mono { font: 500 12px/16px var(--ilha-mono); font-variant-numeric: tabular-nums; }

  .texto-aviso {
    display: flex;
    flex-direction: column;
    white-space: normal;
    max-width: var(--texto-max, 300px);
    line-height: 16px;
  }
  .texto-aviso .linha2 { color: var(--ilha-texto-2); font-weight: 400; }

  [hidden] { display: none !important; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Movimento reduzido: forma troca direto (o JS pula o laço), fades de 120 ms, nada gira; o
     perímetro fica azul fixo de 1,5 a 70% e os pontos param (0,45, 0,75 e 1). */
  @media (prefers-reduced-motion: reduce) {
    .conteudo, .palco[data-conteudo="visivel"] .conteudo { transition: opacity 120ms ease; }
    .pontos i { animation: none; }
    .pontos i:nth-child(1) { opacity: 0.45; }
    .pontos i:nth-child(2) { opacity: 0.75; }
    .palco[data-segmento] .tracos .segmento { animation: none; opacity: 0; }
    .tracos .inteiro { transition: opacity 120ms ease; }
    .palco[data-segmento="girando"] .tracos .inteiro { opacity: 0.7; }
    .tracos .contorno { transition: opacity 120ms ease; }
  }

  @media (forced-colors: active) {
    .casca,
    .palco[data-estado="repouso"] .casca,
    .palco[data-estado="aceno"] .casca { background: Canvas; box-shadow: inset 0 0 0 1px CanvasText; }
    .palco { color: CanvasText; }
    .tracos path { stroke: Highlight; }
    .barras i, .pontos i, .ponto, .ponto-aviso, .btn-circ.parar b { background: Highlight; }
    .btn-ditar, .btn-circ { border: 1px solid ButtonText; color: ButtonText; }
    .tempo, .kbd, .texto-aviso .linha2 { color: CanvasText; }
  }
</style>
</head>
<body>
<div class="palco" id="palco" data-estado="repouso">
  <div class="casca" id="casca">
    <div class="conteudo" id="conteudo">
      <!-- 3. Aberta, ociosa -->
      <div class="vista" id="v-ociosa">
        <button class="btn-ditar" id="btn-ditar" type="button" aria-label="Ditar" title="Ditar em mãos livres">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="#fff" aria-hidden="true"><rect x="4" y="1" width="4" height="7" rx="2"/><path d="M2.5 6a3.5 3.5 0 0 0 7 0" stroke="#fff" fill="none" stroke-width="1.2"/><rect x="5.4" y="9.3" width="1.2" height="1.8"/></svg>
          <span>Ditar</span>
        </button>
        <span class="divisor" aria-hidden="true"></span>
        <span class="kbd" id="chip-atalho">Ctrl dir.</span>
      </div>

      <!-- 4. Gravando, recolhida -->
      <div class="vista" id="v-grav-comp">
        <span class="ponto" aria-hidden="true"></span>
        <div class="barras" id="barras-c" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <!-- 5. Gravando, aberta -->
      <div class="vista" id="v-grav-aberta">
        <span class="ponto" aria-hidden="true"></span>
        <div class="barras" id="barras-a" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <span class="tempo" id="tempo-a">0:00</span>
        <button class="btn-circ cancelar" id="btn-cancelar-a" type="button" aria-label="Cancelar ditado" title="Cancelar ditado">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <!-- 6. Mãos livres -->
      <div class="vista" id="v-maos">
        <button class="btn-circ cancelar" id="btn-cancelar-m" type="button" aria-label="Cancelar ditado" title="Cancelar ditado">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <div class="barras" id="barras-m" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <span class="tempo" id="tempo-m">0:00</span>
        <button class="btn-circ parar" id="btn-parar" type="button" aria-label="Parar e inserir texto" title="Parar e inserir texto"><b aria-hidden="true"></b></button>
      </div>

      <!-- 7. Processando, recolhida -->
      <div class="vista" id="v-proc-comp">
        <div class="pontos" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>

      <!-- 8. Processando, aberta -->
      <div class="vista" id="v-proc-aberta">
        <div class="pontos" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="etapa-texto" id="etapa-texto">Transcrevendo</span>
      </div>

      <!-- 9. Baixando o modelo, recolhida -->
      <div class="vista" id="v-baix-comp">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v7M3 5.8 6 8.8l3-3M2 10.5h8" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span class="mono" id="baixando-pct">0%</span>
      </div>

      <!-- 10. Baixando o modelo, aberta -->
      <div class="vista" id="v-baix-aberta">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v7M3 5.8 6 8.8l3-3M2 10.5h8" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
        <span class="etapa-texto" id="baixando-texto">Baixando o modelo · 0%</span>
      </div>

      <!-- 11 e 12. Aviso / Erro -->
      <div class="vista" id="v-aviso">
        <span class="ponto-aviso" aria-hidden="true"></span>
        <span class="texto-aviso" id="texto-aviso"></span>
      </div>
    </div>
  </div>
  <svg class="tracos" id="tracos" aria-hidden="true">
    <path class="contorno" id="contorno-path" pathLength="1"/>
    <path class="inteiro" id="inteiro-path" pathLength="1"/>
    <path class="segmento" id="segmento-path" pathLength="1"/>
  </svg>
  <div class="alvo-ponta" id="ponta" role="button" aria-label="Dita.se. Clique para ditar" title="Dita.se: clique para ditar"></div>
  <!-- Região viva dedicada: o relógio nunca é anunciado. -->
  <span class="sr-only" id="leitor" role="status" aria-live="polite"></span>
</div>
<script src="pilula.js" defer></script>
</body>
</html>

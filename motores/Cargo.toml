[package]
name = "motores"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nucleo = { path = "../nucleo-rs" }
serde_json = "1"
sha2 = "0.10"
# HTTP só para 127.0.0.1 (llama-server) e para o download dos modelos (HTTPS).
# TLS: rustls no Mac/Linux; no Windows, SChannel do sistema (native-tls), que usa o repositório
# de certificados do Windows (proxy corporativo com certificado próprio funciona).
ureq = { version = "2", default-features = false, features = ["json"] }

# sherpa-onnx oficial (k2-fsa), versão fixada. No Mac e no Linux: estático (nada a distribuir).
# No Windows: DLLs (sherpa-onnx-c-api.dll, onnxruntime.dll), porque as libs estáticas oficiais são
# /MT e o binário Rust/Tauri usa /MD; misturar dá conflito de CRT no link.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["shared"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "medir"
path = "src/bin/medir.rs"

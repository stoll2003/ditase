name: Windows (sobreposição da ilha)
on:
  push:
    branches: [qa-ilha-102-final]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  teste:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CI_RUN: '44984592224'
      CANDIDATO: '6ac17c87266aef1de94c0b32517deb76171ccc38'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Obter o mesmo instalador do CI
        shell: pwsh
        run: |
          $dados = gh run view $env:CI_RUN --json headSha,status,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $dados.headSha -ne $env:CANDIDATO) { throw 'SHA divergente' }
          if ($dados.status -ne 'completed' -or $dados.conclusion -ne 'success') { throw 'CI candidato ainda não passou' }
          gh run download $env:CI_RUN --name ditase-windows-nsis --dir "$env:RUNNER_TEMP\pacote"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao obter o instalador' }
      - name: Instalar e testar mudança para janela sem borda
        shell: pwsh
        timeout-minutes: 4
        run: |
          $pacote = Get-ChildItem "$env:RUNNER_TEMP\pacote" -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $pacote) { throw 'Instalador não encontrado' }
          .\scripts\windows\qa-sobreposicao\provar.ps1 -Instalador $pacote.FullName -Saida "$env:RUNNER_TEMP\ilha-prova"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ilha-sobreposicao-evidencias
          path: |
            ${{ runner.temp }}/ilha-prova/*.json
            ${{ runner.temp }}/ilha-prova/dados/**/*.log
          if-no-files-found: warn
          retention-days: 7

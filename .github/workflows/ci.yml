# CI do port para Windows.
# Mac: testes do núcleo Swift e build da interface.
# Windows: testes do workspace Rust, build da interface e, quando a casca
# Tauri existir (windows/src-tauri/tauri.conf.json), o instalador NSIS por usuário.
name: CI

on:
  push:
    branches: [windows, "win-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  macos:
    name: macOS (Swift + UI)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versão do Swift
        run: swift --version

      - name: swift test (Nucleo)
        working-directory: Nucleo
        run: swift test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build da UI
        working-directory: ui
        run: |
          npm ci
          npm run build

  windows:
    name: Windows (Rust + UI + Tauri)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Modo do build
        id: modo
        shell: bash
        run: |
          if [ -f windows/src-tauri/tauri.conf.json ]; then
            echo "tauri=true" >> "$GITHUB_OUTPUT"
            echo "Casca Tauri encontrada: gera o instalador NSIS."
          else
            echo "tauri=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem windows/src-tauri/tauri.conf.json: só compila e testa o workspace."
          fi

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-x64

      # O rust-cache restaura o build do sherpa-onnx-sys sem as bibliotecas que o build.rs dele
      # baixa para target/sherpa-onnx-prebuilt (LNK1181 sherpa-onnx-c-api.lib). Refaz só esse crate.
      - name: Refazer sherpa-onnx-sys (cache sem as bibliotecas baixadas)
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt && cargo clean -p sherpa-onnx-sys && cargo clean -p sherpa-onnx-sys --release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build da UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: cargo test (workspace)
        run: cargo test --workspace --all-targets

      - name: install.ps1 no Windows PowerShell 5.1 (sintaxe e recusa de hash errado)
        shell: powershell
        run: .\scripts\windows\testar-install.ps1 -Modo sintaxe

      - name: install.ps1 no PowerShell 7 (sintaxe e recusa de hash errado)
        shell: pwsh
        run: .\scripts\windows\testar-install.ps1 -Modo sintaxe

      - name: Preparar binários (vendor)
        if: steps.modo.outputs.tauri == 'true'
        shell: powershell
        run: .\scripts\windows\preparar-vendor.ps1

      - name: Build Tauri (NSIS por usuário, sem atualizador)
        if: steps.modo.outputs.tauri == 'true'
        working-directory: windows
        shell: bash
        run: |
          # installMode currentUser: instala em %LOCALAPPDATA% sem pedir administrador.
          # Em CI não há chave do atualizador (PRs de fora não leem secrets).
          npx --yes @tauri-apps/cli@2 build --bundles nsis --ci \
            --config src-tauri/tauri.distribuicao.conf.json \
            --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"nsis":{"installMode":"currentUser"}}}}'

      - name: install.ps1 instalando o build do CI (por usuário, atalho, desinstala)
        if: steps.modo.outputs.tauri == 'true'
        shell: powershell
        run: |
          $exe = Get-ChildItem target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          .\scripts\windows\testar-install.ps1 -Modo instalacao -Instalador $exe.FullName

      - name: Guardar instalador
        if: steps.modo.outputs.tauri == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ditase-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
